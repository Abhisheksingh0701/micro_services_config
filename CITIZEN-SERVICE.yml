server:
  port: 8081

spring:
  application:
    name: CITIZEN-SERVICE

  custom:
    message: "User Service Config"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

      
